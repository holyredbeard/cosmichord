<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CosmiChord</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://storage.googleapis.com https://cdn.jsdelivr.net https://unpkg.com blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com https://cdn.jsdelivr.net https://unpkg.com blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://storage.googleapis.com https://cdn.jsdelivr.net https://unpkg.com blob:;">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.min.js"></script>
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    #app {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 100vh;
    }
    #sidebar {
      box-sizing: border-box;
      flex: 0 0 250px;
      width: 250px;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #161616;
      border-right: 1px solid #3a3a3a;
      padding: 16px 14px 64px;
      z-index: 2;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    body.sidebar-collapsed #sidebar {
      display: none;
    }
    #renderDiv {
      position: relative;
      flex: 1 1 auto;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      background: #000000;
    }
    .slider-container {
      position: static;
      width: 100%;
      background: transparent;
      padding: 0;
      color: white;
      font-family: Arial, sans-serif;
    }
    .logo-img {
      display: block;
      position: static;
      width: 180px;
      max-width: 100%;
      height: auto;
      margin: 0 0 12px;
    }
    .audio-hint {
      color: #d0d0d0;
      font-size: 12px;
      line-height: 1.35;
      margin: 8px 0 12px;
    }
    #startAudioButton {
      width: 100%;
      margin: 0;
    }
    .mode-button.is-active {
      background: #1d6b3a;
    }
    #aiModeButton.is-active {
      background: #245c8a;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    .button-row button {
      flex: 1 1 calc(50% - 6px);
      margin: 0;
      min-width: 0;
      box-sizing: border-box;
    }
    .slider-item {
      margin-bottom: 10px;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .button-container,
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .toggle-menu {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 1001;
      background-color: #333;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .control-button {
      background: #333;
      color: white;
      border: none;
      padding: 5px 10px;
      margin: 5px;
      cursor: pointer;
      border-radius: 4px;
    }
    .control-button:hover {
      background: #444;
    }
    input[type="range"] {
      width: 100%;
      margin-top: 5px;
    }
    button {
      background-color: #333;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      min-width: 0;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="renderDiv"></div>
  </div>
</body>
</html>
